<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Shadow -->
  <rect x="42" y="72" width="120" height="65" rx="8" fill="#1B5E20" opacity="0.15" />
  
  <!-- Single Bill -->
  <rect x="40" y="70" width="120" height="65" rx="8" fill="#A5D6A7" />
  <rect x="45" y="75" width="110" height="55" rx="4" fill="#E8F5E9" />
  
  <!-- Center Seal -->
  <circle cx="100" cy="102.5" r="14" fill="#C8E6C9" />
  <text x="100" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#81C784" text-anchor="middle">$</text>
  
  <!-- Copper Coin -->
  <circle cx="145" cy="125" r="15" fill="#BCAAA4" />
  <circle cx="145" cy="125" r="11" fill="#D7CCC8" stroke="#8D6E63" stroke-width="1.5" />
  <text x="145" y="131" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#795548" text-anchor="middle">¢</text>

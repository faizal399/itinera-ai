<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Back Bill -->
  <rect x="45" y="55" width="120" height="65" rx="8" fill="#66BB6A" transform="rotate(10, 105, 87)" />
  <rect x="50" y="60" width="110" height="55" rx="4" fill="#81C784" transform="rotate(10, 105, 87)" />
  
  <!-- Front Bill Shadow -->
  <rect x="32" y="77" width="120" height="65" rx="8" fill="#1B5E20" opacity="0.2" />
  
  <!-- Front Bill -->
  <rect x="30" y="75" width="120" height="65" rx="8" fill="#4CAF50" />
  <rect x="35" y="80" width="110" height="55" rx="4" fill="#E8F5E9" />
  
  <!-- Center Seal -->
  <circle cx="90" cy="107.5" r="16" fill="#A5D6A7" />
  <circle cx="90" cy="107.5" r="13" fill="#E8F5E9" stroke="#81C784" stroke-width="1.5" />
  <text x="90" y="116" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#388E3C" text-anchor="middle">$</text>
  
  <!-- Gold Coin 1 -->
  <circle cx="135" cy="135" r="20" fill="#FBC02D" />
  <circle cx="135" cy="135" r="15" fill="#FFF176" stroke="#F9A825" stroke-width="1.5" />
  <text x="135" y="142" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#F57F17" text-anchor="middle">$</text>
  
  <!-- Gold Coin 2 (Background) -->
  <circle cx="155" cy="115" r="16" fill="#FBC02D" />
  <circle cx="155" cy="115" r="12" fill="#FFF176" stroke="#F9A825" stroke-width="1.5" />
</svg>
